<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Frases Glass</title>
    <!-- Tailwind CSS para estilizar rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo Glassmorphism para las tarjetas de tweets */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body id="cuerpo" class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 text-white p-4 md:p-8 transition-colors duration-500" style="background-size: cover; background-position: center;">

    <div class="max-w-4xl mx-auto">
        <!-- Título -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight">✨ Pensamientos en Glass</h1>
            <p class="text-gray-300 text-sm mt-1">Escribe tus frases con estética de notificación iOS</p>
        </header>

        <!-- Panel de Creación / Formulario -->
        <div class="glass-card rounded-2xl p-6 mb-10">
            <h2 class="text-lg font-semibold mb-4 text-white/90">Nuevo Pensamiento</h2>
            <form id="tweetForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-300 mb-1">Tu Frase</label>
                    <textarea id="textoFrase" rows="3" required placeholder="¿Qué estás pensando hoy...?" 
                        class="w-full bg-black/30 border border-white/20 rounded-xl p-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Selector de color de fondo -->
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-300 mb-1">Color de Fondo General</label>
                        <div class="flex items-center gap-2">
                            <input type="color" id="colorFondo" value="#1e1b4b" class="w-10 h-10 rounded-lg bg-transparent cursor-pointer border border-white/20">
                            <span class="text-xs text-gray-300">Elige un tono base</span>
                        </div>
                    </div>

                    <!-- URL de Imagen (Imgur, etc) -->
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-gray-300 mb-1">Fondo de Imagen (Opcional - URL Imgur)</label>
                        <input type="url" id="urlImagen" placeholder="https://i.imgur.com/tu-imagen.jpg" 
                            class="w-full bg-black/30 border border-white/20 rounded-xl p-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400">
                    </div>
                </div>

                <button type="submit" class="w-full bg-white/20 hover:bg-white/30 border border-white/30 font-medium py-2.5 rounded-xl transition duration-200">
                    Publicar Pensamiento
                </button>
            </form>
        </div>

        <!-- Contenedor donde se van listando las tarjetas -->
        <div id="contenedorTweets" class="space-y-4">
            <!-- Aquí se inyectan dinámicamente las tarjetas estilo notificación iOS -->
        </div>
    </div>

    <script>
        const form = document.getElementById('tweetForm');
        const cuerpo = document.getElementById('cuerpo');
        const colorFondoInput = document.getElementById('colorFondo');
        const urlImagenInput = document.getElementById('urlImagen');
        const contenedorTweets = document.getElementById('contenedorTweets');

        // Cambiar color de fondo general en tiempo real
        colorFondoInput.addEventListener('input', (e) => {
            cuerpo.style.background = e.target.value;
        });

        urlImagenInput.addEventListener('input', (e) => {
            if(e.target.value.trim() !== '') {
                cuerpo.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${e.target.value}')`;
            } else {
                cuerpo.style.backgroundImage = 'none';
                cuerpo.style.background = colorFondoInput.value;
            }
        });

        // Guardar y cargar tweets usando localStorage para que no se borren al recargar
        let tweets = JSON.parse(localStorage.getItem('glass_tweets')) || [];

        function renderTweets() {
            contenedorTweets.innerHTML = '';
            if(tweets.length === 0) {
                contenedorTweets.innerHTML = `<p class="text-center text-gray-400 text-sm py-6">No hay pensamientos todavía. ¡Escribe el primero!</p>`;
                return;
            }

            tweets.forEach((tweet, index) => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 md:p-5 relative transition transform hover:-translate-y-1";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <!-- Icono estilo notificación iOS -->
                            <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-xs font-bold border border-white/30">
                                💬
                            </div>
                            <div>
                                <span class="text-xs font-semibold text-white/80 block">Notificación • Ahora</span>
                                <span class="text-xs text-gray-300">Pensamiento</span>
                            </div>
                        </div>
                        <button onclick="eliminarTweet(${index})" class="text-white/40 hover:text-red-400 text-xs transition">✕</button>
                    </div>
                    <div class="mt-3 pl-11">
                        <p class="text-white text-sm md:text-base leading-relaxed whitespace-pre-wrap">${escapeHtml(tweet.texto)}</p>
                    </div>
                `;
                contenedorTweets.appendChild(card);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const texto = document.getElementById('textoFrase').value;
            
            tweets.unshift({ texto }); // Agregar al principio
            localStorage.setItem('glass_tweets', JSON.stringify(tweets));
            
            document.getElementById('textoFrase').value = '';
            renderTweets();
        });

        function eliminarTweet(index) {
            tweets.splice(index, 1);
            localStorage.setItem('glass_tweets', JSON.stringify(tweets));
            renderTweets();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Cargar al iniciar
        renderTweets();
    </script>
</body>
</html>
